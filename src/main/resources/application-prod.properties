# ==========================================================
# Production Profile (Render PostgreSQL)
# ==========================================================
# Dynamically binds to Render's assigned port
server.port=${PORT:9090}

# Database Configuration (PostgreSQL)
# Reads DB_URL, DB_USERNAME, DB_PASSWORD from Render Environment Variables
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Connection Pool (Optimized for Render Free Tier 512MB RAM)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
